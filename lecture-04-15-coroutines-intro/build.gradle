plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
}

group = 'pt.isel.pc'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    // logging
    runtimeOnly("org.slf4j:slf4j-simple:2.0.16")
    implementation("io.github.microutils:kotlin-logging:3.0.5")
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}